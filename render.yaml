services:
  - type: web
    name: zaadaq-portfolio
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /opt/render/project/src/data
    disk:
      name: zaadaq-sqlite-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
